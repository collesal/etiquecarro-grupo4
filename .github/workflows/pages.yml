name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O front busca os dados em ../../../saida e ../../../tesauro.json
      # (relativo a web/src/data), entao o layout do repositorio e mantido.
      - name: Montar o site
        run: |
          mkdir -p _site/saida
          cp -r web _site/web
          rm -rf _site/web/tests
          cp saida/veiculos.json _site/saida/
          cp tesauro.json _site/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=web/"><link rel="canonical" href="web/"><a href="web/">EtiqueCarro</a>' > _site/index.html
          ls -R _site | head -40

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
